<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf5f1"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><meta name="apple-mobile-web-app-title" content="kremushki"><title>kremushki</title><style>*{box-sizing:border-box}body{margin:0;background:#faf5f1;color:#493b40;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:540px;margin:auto;padding:24px 18px 110px}h1{font:italic 42px Georgia;margin:8px 0}h2{font:26px Georgia}small{color:#806e76}section{background:white;border:1px solid #eadfe0;border-radius:22px;padding:18px;margin:14px 0}button,input,textarea,select{font:inherit;color:inherit}button{border:0;background:#eee3e7;border-radius:12px;padding:12px;cursor:pointer}button.active{background:#a66b83;color:white}nav{position:fixed;bottom:0;left:0;right:0;background:#fff9f6;display:flex;justify-content:center;gap:4px;padding:10px 4px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #eadfe0}nav button{font-size:12px;background:transparent}nav button.active{background:#ead5df;color:#493b40}.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.grid button{padding:9px 2px;font-size:14px}.grid small{display:block;font-size:10px}label{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f2e9eb}input[type=checkbox]{accent-color:#a66b83;width:22px;height:22px;flex-shrink:0}textarea,input:not([type=checkbox]),select{width:100%;padding:12px;border:1px solid #e4d5da;border-radius:12px;background:#fff}progress{width:100%;accent-color:#a66b83} .tag{background:#eee3e7;padding:10px;border-radius:12px} .row{display:flex;align-items:center;justify-content:space-between;gap:8px} .muted{font-size:13px;color:#806e76}</style><main><small>MY SKINCARE JOURNEY</small><h1>kremushki</h1><div id="app"></div></main><nav id="nav"></nav><script>
const $=s=>document.querySelector(s), store='beauty-diary-v1';let S;try{S=JSON.parse(localStorage.getItem(store))}catch{} S=S||{checks:{},notes:{},products:{},spf:false,edits:{}};let tab=0;const start=new Date(2026,10,26,12);const date=n=>new Date(2026,10,26+n,12);let day=Math.max(0,Math.round((new Date().setHours(12,0,0,0)-start)/86400000));const fmt=n=>date(n).toLocaleDateString('ru',{day:'numeric',month:'long',weekday:'long'});const am=['ROUND LAB — пенка или вода','MA:NYO Bifida — тонер','PYUNKANG YUL — крем для глаз (по желанию)','CELIMAX Dual Barrier — крем','TOCOBO — SPF 50+'];const types=['VT Reedle Shot','Восстановление','BIODANCE','Восстановление','Кислоты CELIMAX','Восстановление','Восстановление','MEDICUBE','Восстановление','BIODANCE','Восстановление','MIKO + Hikari','Восстановление','Восстановление'];const type=n=>S.edits[n]||types[n%14];const active=t=>['VT Reedle Shot','MEDICUBE','Кислоты CELIMAX'].includes(t);const actual=n=>active(type(n))&&!S.spf?'Восстановление':type(n);const extra={'VT Reedle Shot':['VT Collagen Reedle Shot 100'],'MEDICUBE':['MEDICUBE Exosome Shot 2000'],'Кислоты CELIMAX':['CELIMAX — зелёный кислотный пэд'],'MIKO + Hikari':['Hikari Moist Gel','MIKO — по инструкции','Удалить гель согласно инструкции','CELIMAX — молочный тонер'],'BIODANCE':['BIODANCE — розовые пэды'],'Восстановление':['CELIMAX — молочный тонер']};const pm=n=>['ROUND LAB — масло при необходимости','ROUND LAB — пенка',...extra[actual(n)],'PYUNKANG YUL — крем для глаз (по желанию)','CELIMAX Dual Barrier — крем'];const products=[...am.slice(1), 'ROUND LAB — пенка','ROUND LAB — масло','CELIMAX — молочный тонер','CELIMAX — зелёные пэды','BIODANCE — розовые пэды','VT Collagen Reedle Shot 100','MEDICUBE Exosome Shot 2000','MIKO','Hikari Moist Gel'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(store,JSON.stringify(S))}catch{alert('Не удалось сохранить данные. Сделайте резервную копию.')}}function go(t){tab=t;render()}function choose(n){day=Math.max(0,n);go(0)}function list(a,p){return a.map(t=>`<label><input type="checkbox" ${S.checks[day+'|'+p+'|'+t]?'checked':''} onchange="check(this,${p==='a'?0:1},${a.indexOf(t)})"><span>${esc(t)}</span></label>`).join('')}function check(el,p,i){S.checks[day+'|'+(p?'p':'a')+'|'+(p?pm(day):am)[i]]=el.checked;save();render()}function note(k,v){S.notes[day]={...S.notes[day],[k]:v};save()}function render(){ $('#nav').innerHTML=['Сегодня','Календарь','Косметичка','Дневник','Настройки'].map((t,i)=>`<button class="${tab===i?'active':''}" onclick="go(${i})">${t}</button>`).join('');let h='';if(tab===0){let all=[...am.map(t=>'a|'+t),...pm(day).map(t=>'p|'+t)],c=all.filter(t=>S.checks[day+'|'+t]).length;h=`<div class="row"><button onclick="choose(day-1)">‹</button><b>${fmt(day)}</b><button onclick="choose(day+1)">›</button></div><section><small>Процедура дня</small><h2>${esc(actual(day))}</h2>${actual(day)!==type(day)?'<p class="muted">Актив отложен до регулярного SPF.</p>':''}<progress max="${all.length}" value="${c}"></progress><small>${c} / ${all.length} шагов</small></section><section><h2>☀ Утро</h2>${list(am,'a')}</section><section><h2>☾ Вечер</h2>${list(pm(day),'p')}</section><p class="muted">При раздражении пропусти активы и аппарат. Соблюдай инструкции средств.</p>`}if(tab===1){let base=Math.floor(day/28)*28;h=`<div class="row"><button onclick="day=Math.max(0,day-28);render()">‹</button><b>${fmt(base)} — ${fmt(base+27)}</b><button onclick="day+=28;render()">›</button></div><section class="grid">${Array.from({length:28},(_,i)=>{let n=base+i;return `<button onclick="choose(${n})" class="${n===day?'active':''}">${date(n).getDate()}<small>${({ 'VT Reedle Shot':'VT','MEDICUBE':'MED','Кислоты CELIMAX':'BHA','MIKO + Hikari':'MIKO','BIODANCE':'BIO','Восстановление':'·'})[actual(n)]}</small></button>`}).join('')}</section><section><h2>Изменить процедуру</h2><p>${fmt(day)}</p><select onchange="S.edits[day]=this.value;save();render()">${Object.keys(extra).map(t=>`<option ${type(day)===t?'selected':''}>${t}</option>`).join('')}</select><p class="muted">При изменении графика оставляй несколько дней между активами и аппаратом.</p></section>`}if(tab===2)h=products.map((p,i)=>`<section><b>${esc(p)}</b><p><small>Дата вскрытия</small><input type="date" value="${esc(S.products[i]?.opened)}" onchange="prod(${i},'opened',this.value)"></p><small>Годен до</small><input type="date" value="${esc(S.products[i]?.expiry)}" onchange="prod(${i},'expiry',this.value)"></section>`).join('');if(tab===3)h=`<div class="row"><button onclick="day=Math.max(0,day-1);render()">‹</button><b>${fmt(day)}</b><button onclick="day++;render()">›</button></div><section><h2>Состояние кожи</h2><select onchange="note('mood',this.value)">${['','Отличное','Хорошее','Обычное','Сухость','Покраснение','Высыпания'].map(t=>`<option ${S.notes[day]?.mood===t?'selected':''}>${t}</option>`).join('')}</select><p><textarea rows="5" placeholder="Наблюдения…" oninput="note('text',this.value)">${esc(S.notes[day]?.text)}</textarea></p></section><section><h2>История</h2>${Object.entries(S.notes).sort((a,b)=>b[0]-a[0]).map(([n,v])=>`<p><b>${fmt(+n)}</b><br>${esc(v.mood)} ${esc(v.text)}</p>`).join('')}</section>`;if(tab===4)h=`<section><h2>Настройки</h2><label><input type="checkbox" ${S.spf?'checked':''} onchange="S.spf=this.checked;save();render()">Регулярно использую SPF</label><p class="muted">Без этой отметки кислоты и спикулы заменяются восстановлением.</p></section><section><h2>Резервная копия</h2><button onclick="backup()">Экспорт данных</button><p><input type="file" accept="application/json" onchange="restore(this)"></p><small>Данные хранятся только на этом устройстве. Импорт заменяет текущий дневник.</small></section>`;$('#app').innerHTML=h}function prod(i,k,v){S.products[i]={...S.products[i],[k]:v};save()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='kremushki-backup.json';a.click()}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!x.checks||!x.notes||!x.products||!x.edits)throw Error();if(confirm('Заменить текущие данные?')){S=x;save();render()}}catch{alert('Не удалось прочитать копию')}}render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});</script></html>
